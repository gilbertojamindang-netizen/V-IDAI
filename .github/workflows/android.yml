name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Unzip and Flatten Project
      run: |
        ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
        if [ -n "$ZIP_FILE" ]; then
          unzip "$ZIP_FILE" -d temp_dir
          PKG_FILE=$(find temp_dir -name "package.json" -not -path "*/node_modules/*" | head -n 1)
          if [ -n "$PKG_FILE" ]; then
            PROJECT_DIR=$(dirname "$PKG_FILE")
            mv "$PROJECT_DIR"/* .
          fi
          rm -rf temp_dir *.zip
        fi

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies with Force
      run: npm install --force # ITO ANG MAGPIPILIT NA MA-INSTALL KAHIT MAG-AWAY SILA

    - name: Build Web App
      run: npm run build || npm run build -- --emptyOutDir

    - name: Install and Sync Capacitor
      run: |
        npm install @capacitor/core @capacitor/cli @capacitor/android --force
        npx cap init "VOID.AI" "com.voidai.app" --web-dir=dist
        npx cap add android
        npx cap sync android

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Build Android APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: VOID-AI-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
