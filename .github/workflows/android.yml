name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Fix project root
      run: |
        # Kung ang package.json ay nasa loob ng isang sub-folder, ilipat natin sa root
        if [ -f "VOIDAI/package.json" ]; then mv VOIDAI/* .; fi
        if [ -f "void-ai-capacitor-android/package.json" ]; then mv void-ai-capacitor-android/* .; fi

    - name: Install dependencies
      run: npm install --legacy-peer-deps

    - name: Build Web App
      run: npm run build

    - name: Install and Sync Capacitor
      run: |
        npm install @capacitor/core @capacitor/cli @capacitor/android
        npx cap init "VOID.AI" "com.voidai.app" --web-dir=dist
        npx cap add android
        npx cap sync android

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Build Android APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: VOID-AI-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
