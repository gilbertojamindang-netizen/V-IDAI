name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Unzip and Flatten Project
      run: |
        # Hanapin ang ZIP file
        ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
        if [ -z "$ZIP_FILE" ]; then
          echo "Walang ZIP file na nahanap!"
          exit 1
        fi
        
        # I-extract ang ZIP
        unzip "$ZIP_FILE" -d temp_dir
        
        # Hanapin kung saan yung package.json
        PKG_FILE=$(find temp_dir -name "package.json" -not -path "*/node_modules/*" | head -n 1)
        if [ -z "$PKG_FILE" ]; then
          echo "Walang package.json na nahanap!"
          exit 1
        fi
        
        # Kunin ang folder kung nasaan ang package.json at ilipat sa root
        PROJECT_DIR=$(dirname "$PKG_FILE")
        mv "$PROJECT_DIR"/* .
        
        # Linisin
        rm -rf temp_dir *.zip

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm install --legacy-peer-deps

    - name: Build Web App
      run: npm run build

    - name: Install and Sync Capacitor
      run: |
        npm install @capacitor/core @capacitor/cli @capacitor/android
        npx cap init "VOID.AI" "com.voidai.app" --web-dir=dist
        npx cap add android
        npx cap sync android

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Build Android APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: VOID-AI-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
